rules:
  # Keep local / private destinations out of proxy and reject policies.
  - RULE-SET,private,DIRECT
  - RULE-SET,private-ip,DIRECT,no-resolve
  - RULE-SET,NoBanDirect,DIRECT

  # DoT upstream exceptions must precede DNS REJECT rules.
  - DOMAIN,security.cloudflare-dns.com,代理
  - DOMAIN,159277.alidns.com,DIRECT
  - RULE-SET,doh-geosite,REJECT
  - RULE-SET,dns-bypass,REJECT

  # Threat-intel and privacy categories.
  - RULE-SET,phishing-army,REJECT
  - RULE-SET,privacy-telemetry,REJECT
  - RULE-SET,privacy-tracker,REJECT

  # Custom policy sets.
  - RULE-SET,userReject,REJECT,no-resolve
  - RULE-SET,userProxy,代理
  - RULE-SET,userDirect,DIRECT

  # YouTube is proxied after explicit userDirect exceptions.
  - RULE-SET,YouTube,代理

  # Ads-only upstream variant; PCDN and telemetry are maintained separately.
  - RULE-SET,秋风广告规则,REJECT,no-resolve
  - RULE-SET,pcdn,REJECT,no-resolve
  - RULE-SET,Advertising,REJECT,no-resolve
  - RULE-SET,cloudflare,代理
  - RULE-SET,gfw,代理
  - RULE-SET,porn,代理
  - RULE-SET,microsoft_cdn,DIRECT
  - RULE-SET,microsoft@cn,DIRECT
  - RULE-SET,cloudflare@cn,DIRECT
  - RULE-SET,GameDownload,DIRECT
  - RULE-SET,tvbox,DIRECT
  # Steam CDN 直连不可达：解析到中国移动定向 CDN（39.136/60.9 段），必须走代理
  - DOMAIN-SUFFIX,eccdnx.com,代理
  - DOMAIN-SUFFIX,steamcontent.com,代理
  - DOMAIN-SUFFIX,clngaa.com,代理
  - RULE-SET,china-ASN,DIRECT
  - RULE-SET,GoogleFCM,DIRECT
  - RULE-SET,steam-cn,DIRECT
  - RULE-SET,google-cn,DIRECT
  - RULE-SET,games-cn,DIRECT
  - RULE-SET,cn,DIRECT
  - RULE-SET,hk-ip,DIRECT,no-resolve
  - MATCH,代理
