name: Build MRS rule providers

on:
  push:
    paths:
      - "clashrulepro_optimized_public_free.yaml"
      - "pcdn.yaml"
      - "DNS.yaml"
      - "Fakeip.yaml"
      - "scripts/build_mrs.py"
      - "requirements-ci.txt"
      - ".github/workflows/build-mrs.yml"
  pull_request:
    paths:
      - "clashrulepro_optimized_public_free.yaml"
      - "pcdn.yaml"
      - "DNS.yaml"
      - "Fakeip.yaml"
      - "scripts/build_mrs.py"
      - "requirements-ci.txt"
      - ".github/workflows/build-mrs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Convert domain / IP rules to MRS
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install YAML parser
        run: python -m pip install -r requirements-ci.txt
      - name: Download pinned Mihomo converter
        shell: bash
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz" \
            -o /tmp/mihomo.gz
          echo "132f6f3edf9a65e62f04853aed3358472e0b2b7666daa8419edfa2ddf5bb6323  /tmp/mihomo.gz" | sha256sum --check
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo
          chmod +x /tmp/mihomo
          /tmp/mihomo -v
      - name: Generate rule providers
        run: python scripts/build_mrs.py --mihomo /tmp/mihomo
      - name: Commit generated providers
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rule_providers/
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate split MRS rule providers"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
