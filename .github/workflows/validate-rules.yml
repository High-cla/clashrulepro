name: Validate rules

on:
  push:
    paths:
      - "*.yaml"
      - "scripts/validate_rules.py"
      - ".github/workflows/validate-rules.yml"
  pull_request:
    paths:
      - "*.yaml"
      - "scripts/validate_rules.py"
      - ".github/workflows/validate-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Rule syntax and conflict checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install "PyYAML>=6,<7"
      - name: Validate rule files
        run: python scripts/validate_rules.py
